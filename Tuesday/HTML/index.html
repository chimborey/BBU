<!DOCTYPE html>
<html lang="km">

<head>
      <meta charset="UTF-8">
      <style>
            body {
                  font-family: Arial, sans-serif;
                  margin: 0;
                  padding: 0;
                  color: #333;
            }

            div{
                  margin-top: 5%;
            }

            .header {
                  margin-left: 10%;
                  width: 100%;
                  margin-bottom: 20px;
            }

            table {
                  width: 80%;
                  margin: auto;
                  border-collapse: collapse;
                  margin-top: 10px;
            }

            th,
            td {
                  border: 1px solid #000;
                  padding: 8px;
                  text-align: left;
            }

            th {
                  background-color: #2c5d8f;
                  color: white;
                  text-align: center;
            }

            .grand-total-row {
                  background-color: #f08030;
                  font-weight: bold;
            }

            .text-right {
                  text-align: right;
            }

            .text-center {
                  text-align: center;
            }
      </style>
</head>

<body>
      <div>
            <div class="header">
                  <p><strong>Date:</strong> 2026-08-11</p>
                  <p><strong>Customer:</strong> Walk-In</p>
                  <p><strong>Phone:</strong> 093 240 004</p>
            </div>
            <table>
                  <thead>
                        <tr>
                              <th style="width: 10%">#</th>
                              <th style="width: 40%">Item</th>
                              <th style="width: 15%">Unit Price</th>
                              <th style="width: 15%">Qty</th>
                              <th style="width: 20%">Total</th>
                        </tr>
                  </thead>
                  <tbody>
                        <tr>
                              <td class="text-center">1</td>
                              <td>Coca Cola</td>
                              <td class="text-right">0.50</td>
                              <td class="text-center">2</td>
                              <td class="text-right">1.00</td>
                        </tr>
                        <tr>
                              <td class="text-center">2</td>
                              <td>Vital 500ml</td>
                              <td class="text-right">0.25</td>
                              <td class="text-center">5</td>
                              <td class="text-right">1.25</td>
                        </tr>
                        <tr>
                              <td class="text-center">3</td>
                              <td>ABC</td>
                              <td class="text-right">1.50</td>
                              <td class="text-center">3</td>
                              <td class="text-right">4.50</td>
                        </tr>
                        <tr>
                              <td class="text-center">4</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                        </tr>
                        <tr>
                              <td class="text-center">5</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                        </tr>
                        <tr>
                              <td class="text-center">6</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                              <td>&nbsp;</td>
                        </tr>
                        <tr class="grand-total-row">
                              <td colspan="4" class="text-right">Grand Total</td>
                              <td class="text-right">6.75</td>
                        </tr>
                  </tbody>
            </table>
      </div>
</body>

</html>
